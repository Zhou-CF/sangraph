[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanitizer"
version = "0.1.0"
description = "Sanitizer scanning, analysis, validation, and RAG utilities"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "grep-ast",
    "fastapi>=0.115.0",
    "langchain>=1.2.6",
    "langchain-classic>=1.0.0",
    "filelock>=3.20.2",
    "gitpython>=3.1.46",
    "langchain-anthropic>=1.3.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "paramiko>=4.0.0",
    "tqdm>=4.67.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.1",
    "langchain-deepseek>=1.0.1",
    "docker>=7.1.0",
    "json-repair>=0.55.1",
    "multilspy>=0.0.15",
    "pymilvus>=2.6.8",
    "langchain-milvus>=0.3.3",
    "langchain-community>=0.4.1",
    "dashscope>=1.25.11",
    "sentence-transformers>=5.2.3",
    "uvicorn>=0.48.0",
]

[tool.uv.sources]
grep-ast = { git = "https://github.com/paul-gauthier/grep-ast.git" }

[tool.uv]
override-dependencies = [
    "requests>=2.32.5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["base_opencode", "llm_factory", "rag", "sangraph_logging", "scanner", "validation_opencode", "webapp"]

[tool.setuptools.package-data]
base_opencode = ["prompt/*.txt"]
rag = ["prompt/*.txt"]
validation_opencode = [
    "skills/vuln-verification/SKILL.md",
    "skills/vuln-verification/agents/*.yaml",
    "skills/vuln-verification/references/*.md",
]
